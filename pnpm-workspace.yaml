packages:
  - apps/*
  - packages/*

# Supply-chain guard: never resolve an npm version published less than 7 days ago
# (value is in minutes). pnpm picks the newest version that is old enough.
# This covers npm packages only. The sim engine and game data are pinned in
# engine.lock.json and are meant to update the same day.
# To let one package through early, add it to minimumReleaseAgeExclude with a
# comment and the PR that needed it.
minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

# Install scripts are denied unless listed here (pnpm ≥ 11 `allowBuilds`).
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
