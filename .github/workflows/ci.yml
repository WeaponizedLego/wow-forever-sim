name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # --frozen-lockfile also re-checks every locked version against minimumReleaseAge.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  # Browser end-to-end tests (apps/web/e2e) against the production build with the real engine.
  # Separate from `check` so the required check stays fast; see apps/web/playwright.config.ts.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not --optional: the tests sim with the real engine, so a missing or bad release must fail here.
      - run: node apps/web/scripts/stage-engine.mjs
      - run: pnpm --filter @fsim/web exec nuxt generate
      - run: pnpm --filter @fsim/web exec playwright install --with-deps --only-shell chromium
      - run: pnpm --filter @fsim/web exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
